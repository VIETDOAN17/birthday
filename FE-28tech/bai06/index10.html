<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- <meta http-equiv="X-UA-Compatible" content="IE=edge"> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        h1{
            color: #c41616;
            font-size: 80px;
        }
        @media screen and (max-width:1024px) {
            h1{
                color: yellow;
                font-size: 80px;
            }
        }
        @media screen and (max-width:768px) {
            h1{
                color: rgb(14, 243, 110);
                font-size: 80px;
            }
        }
         @media screen and (max-width:480px) {
            h1{
                color: rgb(90, 2, 252);
                font-size: 50px;
            }
        }
         @media screen and (max-width:320px) {
            h1{
                color: rgb(255, 0, 191);
                font-size: 40px;
            }
        }
    </style>
    <h1>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Ullam quas laboriosam ducimus? Dolorum suscipit ea distinctio repudiandae, sint amet rerum?
         Quam corporis quidem voluptatem exercitationem sapiente atque dolorum soluta? Odio.
    </h1>
</body>
</html>
